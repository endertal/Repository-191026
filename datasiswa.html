<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        table, th, td {
            border: 1px solid powderblue;
            border-collapse: collapse;
            padding: 6px;
            max-width: 500px;
            font-size: 12px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>DATA SISWA RPL</h2>
    <button onclick="window.location.href='semantic.html'">Back</button>
    <table id="siswa-rpl">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Panggilan</th>
                <th>Kelas</th>
                <th>Jenis Kelamin</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>    
    <script>
        $.getJSON('https://api.rplcoders.com/siswa.php', function(data) {
            $('#siswa-rpl tbody').html(
                $.map(data.siswa, siswa => 
                    `<tr><td>${siswa.id}</td>
                    <td>${siswa.nama}</td>
                    <td>${siswa.panggilan}</td>
                    <td>${siswa.kelas}</td>
                    <td>${siswa.jk}</td>
                    </tr>`
                ).join('')
            );
        });
    </script>
</body>
</html>
